<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Gen Z Cashier 💸</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>

</head>

<body>

<div class="bg-glow"></div>

<div class="app">

  <!-- INPUT -->
  <div class="glass card">
    <h2>💸 Gen Z Kasir</h2>

    <input id="toko" placeholder="🏪 Nama Toko">
    <input id="barang" placeholder="📦 Nama Barang">
    <input id="harga" type="number" placeholder="💰 Harga">
    <input id="qty" type="number" placeholder="🔢 Qty">

    <!-- SEARCH -->
    <input id="search" placeholder="🔍 Cari Kode TRX">
    <button class="btn" onclick="searchTRX()">Cari Struk</button>

    <button class="btn neon" onclick="generate()">Generate 🚀</button>
    <button class="btn" onclick="download()">Download PNG 📥</button>
  </div>

  <!-- STRUK -->
  <div id="receipt" class="receipt glass">

    <div class="center">
      <div class="title">✨ STRUK PAYMENT ✨</div>
      <div id="tokoOut">TOKO</div>
    </div>

    <div class="line"></div>

    <div class="row"><span>📦 Item</span><span id="itemOut">-</span></div>
    <div class="row"><span>💰 Price</span><span id="hargaOut">0</span></div>
    <div class="row"><span>🔢 Qty</span><span id="qtyOut">0</span></div>

    <div class="line"></div>

    <div class="row total"><span>🧾 TOTAL</span><span id="totalOut">0</span></div>

    <div class="line"></div>

    <!-- TRX CODE -->
    <div class="center" id="trxOut">TRX-</div>

    <div class="line"></div>

    <!-- QRIS -->
    <div class="center">
      <div id="qrcode"></div>
      <small>scan for pay 💳</small>
    </div>

    <div class="line"></div>

    <!-- BARCODE -->
    <div class="center">
      <svg id="barcode"></svg>
    </div>

    <div class="time" id="time"></div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
